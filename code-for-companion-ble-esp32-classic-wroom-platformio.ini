[my_esp32_sx1278_companion_base]
extends = esp32_base
board = esp32dev
build_flags =
  ${esp32_base.build_flags}
  -I variants/my_esp32_sx1278_companion
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D P_LORA_DIO_0=10
  -D P_LORA_DIO_1=0
  -D P_LORA_NSS=7
  -D P_LORA_RESET=3
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/my_esp32_sx1278_companion>

[env:my_esp32c3_sx1278_companion_ble]
extends = my_esp32c3_sx1278_companion_base
board_build.partitions = huge_app.csv
build_flags =
  ${my_esp32c3_sx1278_companion_base.build_flags}
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_DEBUG_LOGGING=1
  -D MESH_DEBUG=1

build_src_filter =
  ${my_esp32c3_sx1278_companion_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
