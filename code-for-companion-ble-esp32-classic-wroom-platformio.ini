; ============================================================
; ESP32-C3 Super Mini + RA-02 SX1278 433 MHz
; MeshCore Companion Radio - BLE
; ============================================================

[my_esp32c3_sx1278_companion_base]
extends = esp32_base
board = esp32-c3-devkitm-1

build_flags =
  ${esp32_base.build_flags}
  -I variants/my_esp32c3_sx1278_companion

  ; MeshCore / RadioLib
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper

  ; ----------------------------------------------------------
  ; ESP32-C3 Super Mini -> RA-02 SX1278
  ; ----------------------------------------------------------
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=7
  -D P_LORA_RESET=3
  -D P_LORA_DIO_0=10
  -D P_LORA_DIO_1=1

  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=17

  ; Must match the repeater
  -D LORA_FREQ=433.175

build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/my_esp32c3_sx1278_companion>

; ------------------------------------------------------------
; Companion BLE
; ------------------------------------------------------------
[env:my_esp32c3_sx1278_companion_ble]
extends = my_esp32c3_sx1278_companion_base

build_flags =
  ${my_esp32c3_sx1278_companion_base.build_flags}
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128

build_src_filter =
  ${my_esp32c3_sx1278_companion_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
