; ============================================================
; ESP32-C3 Super Mini + RA-02 SX1278 433 MHz
; MeshCore repeater
; ============================================================

[my_esp32c3_sx1278]
extends = esp32_base
board = esp32-c3-devkitm-1

build_flags =
  ${esp32_base.build_flags}
  -I variants/my_esp32c3_sx1278

  ; MeshCore / RadioLib
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper

  ; ----------------------------------------------------------
  ; ESP32-C3 Super Mini -> RA-02 SX1278
  ; ----------------------------------------------------------
  ; RA-02 SCK   -> GPIO4
  ; RA-02 MISO  -> GPIO5
  ; RA-02 MOSI  -> GPIO6
  ; RA-02 NSS   -> GPIO7
  ; RA-02 RESET -> GPIO3
  ; RA-02 DIO0  -> GPIO10
  ; RA-02 DIO1  -> GPIO1
  ; ----------------------------------------------------------
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=7
  -D P_LORA_RESET=3
  -D P_LORA_DIO_0=10
  -D P_LORA_DIO_1=1

  ; SX1278 settings
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=17

  ; 433 MHz. Change this on BOTH repeater and companion
  ; if you choose another channel.
  -D LORA_FREQ=433.175

build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/my_esp32c3_sx1278>

; ------------------------------------------------------------
; Repeater
; ------------------------------------------------------------
[env:my_esp32c3_sx1278_repeater]
extends = my_esp32c3_sx1278

build_flags =
  ${my_esp32c3_sx1278.build_flags}
  -D ADVERT_NAME='"PARS MeshCore Repeater C3"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"pakistan"'
  -D MAX_NEIGHBOURS=8

build_src_filter =
  ${my_esp32c3_sx1278.build_src_filter}
  +<../examples/simple_repeater>

lib_deps =
  ${my_esp32c3_sx1278.lib_deps}
  ${esp32_ota.lib_deps}
